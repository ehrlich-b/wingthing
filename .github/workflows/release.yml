name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
        required: true

# A tag's previous run must finish before another run may publish it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject prerelease tags before building or publishing
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          test "${{ github.ref_type }}" = tag
          sh scripts/check-release-tag.sh "$VERSION"

  deterministic:
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -p 2 ./test/release -count=1
      # Compatibility launches historical and candidate binaries from temporary
      # paths, and integration starts sandboxed terminals on the runner host.
      # Ubuntu's path-scoped AppArmor userns policy cannot grant either; the
      # ci workflow's Linux sandbox jobs exercise that security boundary.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make check
      - run: npm install -g @anthropic-ai/claude-code@2.1.260
      - run: make gate GATE=claude
      - run: make gate GATE=static RACE_PACKAGES=./...
      - run: make gate GATE=integration
      - run: make gate GATE=compat
      - run: make e2e-linux LINUX_DISTROS=debian
      - run: make e2e-linux LINUX_DISTROS=ubuntu
      - run: make e2e-web
      - run: git diff --check
      - name: Build release artifacts after deterministic gates
        env:
          VERSION: ${{ github.ref_name }}
        run: make release CHANNEL=stable VERSION="$VERSION"
      - name: Preserve tested release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wingthing-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  macos-sandbox:
    needs: release-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # macOS configures only 127.0.0.1 on lo0; the specific-loopback listen
      # test binds 127.0.0.2.
      - run: sudo ifconfig lo0 alias 127.0.0.2 up
      - run: make e2e-mac

  release:
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    permissions:
      contents: write
    needs: [deterministic, macos-sandbox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts from the deterministic gate
        uses: actions/download-artifact@v4
        with:
          name: wingthing-release-${{ github.sha }}
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/wt-linux-amd64 dist/wt-linux-arm64
          dist/wt-darwin-amd64 dist/wt-darwin-arm64
          dist/SHA256SUMS --generate-notes
