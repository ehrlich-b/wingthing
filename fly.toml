app = "wingthing"
primary_region = "ewr"

[build]

[deploy]
  strategy = "rolling"

[processes]
  login = "sh -c 'umask 077 && mkdir -p /data/.wingthing && HOME=/data exec ./wt serve --addr :8080'"
  # Optional edges are disabled in the checked-in deployment. Enabling them also
  # requires adding "edge" to http_service.processes before deploy and scale.
  # edge = "./wt serve --addr :8080"

[env]
  WT_BASE_URL = "https://wingthing.ai"
  # Public hosted policy is explicit. Private `wt serve` deployments retain
  # legacy relay behavior unless their operator makes the same choice.
  WT_RELAY_POLICY = "direct-free"
  WT_RELAY_MIGRATION_BEFORE = "2026-08-26T00:00:00Z"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["login"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

# Volume only on login node (SQLite lives here).
# Node role auto-detected: /data mounted = login, otherwise = edge.
# Login address auto-derived from Fly internal DNS (login.process.<app>.internal).
[[mounts]]
  source = "wt_data"
  destination = "/data"
  processes = ["login"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
  processes = ["login"]

# Optional edge rollout:
#   1. Uncomment the edge process above.
#   2. Change http_service.processes to ["login", "edge"].
#   3. Run fly deploy and verify login remains healthy.
#   4. Scale edges, for example: fly scale count edge=2 --region nrt,lhr
#
# One-time setup:
#   fly secrets set WT_JWT_KEY=$(wt keygen)
