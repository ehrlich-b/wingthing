syntax = "proto3";
package egg;
option go_package = "github.com/ehrlich-b/wingthing/internal/egg/pb";

service Egg {
    rpc Kill(KillRequest) returns (KillResponse);
    rpc Resize(ResizeRequest) returns (ResizeResponse);
    rpc Session(stream SessionMsg) returns (stream SessionMsg);
    rpc Status(StatusRequest) returns (StatusResponse);
}

message StatusRequest {
    // Host controller recovery only; ordinary status never returns secrets.
    bool reclaim_tools = 1;
}
message StatusResponse {
    string session_id = 1;
    string agent = 2;
    int64 buffer_bytes = 3;
    int64 total_written = 4;
    int64 total_trimmed = 5;
    int32 readers = 6;
    int64 uptime_seconds = 7;
    string rendered_config = 8;
    int64 idle_seconds = 9;
    string writer_id = 10;
    string writer_owner = 11;
    uint64 input_epoch = 12;
    int32 process_pid = 13;
    string tool_capability = 14;
}

message KillRequest { string session_id = 1; }
message KillResponse {}

message ResizeRequest {
    string session_id = 1;
    uint32 rows = 2;
    uint32 cols = 3;
    string attachment_id = 4;
    uint64 input_epoch = 5;
    string attachment_token = 6;
}
message ResizeResponse {}

message SessionMsg {
    string session_id = 1;
    AttachOptions attach_options = 8;
    AttachmentInfo attachment_info = 9;
    oneof payload {
        bytes output = 2;
        bytes input = 3;
        Resize resize = 4;
        int32 exit_code = 5;
        bool attach = 6;
        bool detach = 7;
    }
}

message AttachOptions {
    bool read_only = 1;
    bool takeover = 2;
    bool claim = 3;
    string owner = 4;
    uint32 rows = 5;
    uint32 cols = 6;
}

message AttachmentInfo {
    string attachment_id = 1;
    string writer_id = 2;
    string writer_owner = 3;
    uint64 input_epoch = 4;
    string attachment_token = 5;
}

message Resize {
    uint32 rows = 1;
    uint32 cols = 2;
}
