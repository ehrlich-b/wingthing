# Sealed shared-host policy mirroring the deployed role eggs. The browser test
# runs privileged specifically so the nested Linux jail is a required gate.
base: none
fs:
  - deny:/
  - ro:/usr
  - ro:/etc
  - ro:/var
  - ro:/opt/wingthing/repos
  - rw:.
  - deny-write:./egg.yaml
network:
  domains: ["*"]
env: ["*"]
