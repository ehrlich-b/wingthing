org: example
locked: false
spectate: false
admins:
  - alice@example.com
egg_config: /root/.wingthing/egg.yaml
paths:
  - path: /opt/wingthing/eng
    members:
      - alice@example.com
      - bob@example.com
  - path: /opt/wingthing/support
    members:
      - alice@example.com
      - carol@example.com
exports:
  - name: isolated-review
    path: /opt/wingthing/exports
    members:
      - carol@example.com
audit: true
idle_timeout: 4h
mcp:
  enabled: true
  default_allow_all: false
  roles:
    eng:
      enabled: true
      members:
        - alice@example.com
        - bob@example.com
    support:
      enabled: true
      members:
        - alice@example.com
        - carol@example.com
